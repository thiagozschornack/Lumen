<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#08161b">
<title>LUMEN</title>
<meta name="description" content="LUMEN — Os Guardiões dos Mundos Perdidos. Jogo de aventura e plataforma 2.5D da EmpreenderTHZ Games. Versão 2: Mundo 1 com duas fases e o guardião Raizeiro.">
<meta property="og:title" content="LUMEN — EmpreenderTHZ Games">
<meta property="og:description" content="Aventura e plataforma 2.5D. Atravesse a Floresta das Luzes Esquecidas com Auri, PIP e Lyra.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: canvas em tela cheia; menus ancorados à esquerda sobre a floresta viva; HUD nos cantos respeitando safe-area */
:root{
  --night:#08161b;
  --ink:#0f2730;
  --ink-2:#163640;
  --lumen:#ffd36e;
  --spore:#79f2d0;
  --rose:#ff6f91;
  --lyra:#c7a6ff;
  --mist:#eaf5f0;
  --mist-dim:#a3beb7;
  --f-display:"Grandstander","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--mist);overflow:hidden;font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}

/* ---------- Android ---------- */
#exitHint{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:opacity .25s,transform .25s;background:rgba(6,16,20,.92);color:var(--mist);border:1px solid rgba(121,242,208,.35);padding:10px 18px;border-radius:999px;font:700 14px/1.2 var(--f-body);z-index:99;pointer-events:none}
#exitHint.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Menus ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:flex-end;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));box-sizing:border-box;pointer-events:auto}
.screen.center{align-items:center;justify-content:center;background:rgba(5,14,18,.55);backdrop-filter:blur(3px)}
.title-wrap{display:flex;flex-direction:column;gap:18px;max-width:560px;background:linear-gradient(90deg,rgba(6,16,20,.8),rgba(6,16,20,0));padding:28px 70px 28px 8px;margin-left:-8px;border-radius:0 24px 24px 0}
.studio{font:700 12px/1 var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:var(--spore)}
.logo{font:900 clamp(64px,13vw,132px)/.82 var(--f-display);letter-spacing:.04em;margin:0;color:var(--lumen);text-shadow:0 0 18px rgba(255,190,80,.55),0 0 60px rgba(255,170,60,.35)}
.logo span{display:inline-block;animation:breathe 4s ease-in-out infinite}
.logo span:nth-child(2){animation-delay:.25s}.logo span:nth-child(3){animation-delay:.5s}.logo span:nth-child(4){animation-delay:.75s}.logo span:nth-child(5){animation-delay:1s}
@keyframes breathe{50%{transform:translateY(-4px);text-shadow:0 0 26px rgba(255,210,110,.8),0 0 80px rgba(255,170,60,.45)}}
.subtitle{font:500 clamp(16px,2.4vw,22px)/1.2 var(--f-display);color:var(--mist);margin:0}
.menu{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:6px}
.btn{font:700 17px/1 var(--f-display);letter-spacing:.02em;color:var(--mist);background:rgba(15,39,48,.82);border:1.5px solid rgba(121,242,208,.28);padding:13px 22px;border-radius:999px;cursor:pointer;min-width:220px;text-align:left;transition:transform .12s,border-color .12s,background .12s}
.btn:hover,.btn:focus-visible{border-color:var(--spore);background:rgba(22,54,64,.95);transform:translateX(4px);outline:none}
.btn.primary{background:var(--lumen);color:#2a1a05;border-color:var(--lumen);box-shadow:0 0 24px rgba(255,200,90,.35)}
.btn.primary:hover,.btn.primary:focus-visible{background:#ffe09a}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.foot{font-size:12px;color:var(--mist-dim);letter-spacing:.04em}
.panel{background:rgba(10,28,34,.94);border:1px solid rgba(121,242,208,.22);border-radius:22px;padding:26px 28px;width:min(470px,100%);box-sizing:border-box;max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.panel.wide{width:min(920px,100%)}
.panel h2{font:800 32px/1 var(--f-display);margin:0 0 6px;color:var(--lumen);text-wrap:balance}
.panel p{margin:0 0 14px;color:var(--mist-dim);line-height:1.5}
.panel .menu{align-items:stretch}
.panel .btn{text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(121,242,208,.1)}
.row label{font-weight:700}
.row small{display:block;font-weight:400;color:var(--mist-dim);font-size:12.5px;margin-top:2px}
.row input[type=range]{width:150px;accent-color:var(--spore)}
.row select{background:var(--ink-2);color:var(--mist);border:1px solid rgba(121,242,208,.3);border-radius:10px;padding:6px 10px;font:inherit}
.switch{appearance:none;width:44px;height:26px;border-radius:99px;background:#2b4650;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mist);transition:transform .15s}
.switch:checked{background:var(--spore)}.switch:checked::after{transform:translateX(18px)}
.switch:focus-visible,.row select:focus-visible,.row input:focus-visible{outline:2px solid var(--lumen);outline-offset:2px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:6px 0 18px;font-size:15px}
.keys kbd{font:700 13px/1 var(--f-body);background:var(--ink-2);border:1px solid rgba(121,242,208,.3);border-bottom-width:3px;border-radius:7px;padding:5px 8px;color:var(--mist);white-space:nowrap;justify-self:start}
.feat{margin:4px 0 16px;padding:0;list-style:none;display:grid;gap:7px;font-size:14.5px;line-height:1.4}
.feat li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.feat li::before{content:"◆";color:var(--lumen);font-size:11px;padding-top:3px}
.feat.pending li::before{content:"◇";color:var(--mist-dim)}
.eyebrow{font:700 11px/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--spore);margin:14px 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 18px}
.stat{background:var(--ink-2);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:800 26px/1.1 var(--f-display);color:var(--mist);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mist-dim);letter-spacing:.06em;text-transform:uppercase}
.medal{display:flex;align-items:center;gap:12px;margin:0 0 16px;font:700 18px/1.2 var(--f-display)}
.medal i{width:40px;height:40px;border-radius:50%;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 18px currentColor}

/* Mapa do mundo */
.map-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.map-head .eyebrow{margin:0 0 8px}
.nodes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;position:relative}
.node{background:var(--ink-2);border:1.5px solid rgba(121,242,208,.18);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left;color:var(--mist);font:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.node:hover:not([disabled]),.node:focus-visible{border-color:var(--lumen);transform:translateY(-3px);outline:none}
.node[disabled]{cursor:not-allowed;opacity:.5}
.node .num{font:900 34px/1 var(--f-display);color:var(--lumen)}
.node .num small{font-size:13px;color:var(--rose);letter-spacing:.12em;text-transform:uppercase;margin-left:8px;vertical-align:middle}
.node h3{margin:0;font:800 18px/1.15 var(--f-display);text-wrap:balance}
.node .meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 11.5px/1 var(--f-body);letter-spacing:.04em;padding:6px 9px;border-radius:99px;background:rgba(234,245,240,.08);color:var(--mist-dim);font-variant-numeric:tabular-nums}
.chip.gold{background:rgba(255,211,110,.18);color:var(--lumen)}
.chip.ok{background:rgba(121,242,208,.15);color:var(--spore)}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:18px 0}
.world{border:1px dashed rgba(234,245,240,.18);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--mist-dim)}
.world b{display:block;color:var(--mist);font:700 14px/1.2 var(--f-display);margin-bottom:3px}
.map-actions{display:flex;gap:10px;flex-wrap:wrap}
.map-actions .btn{min-width:0}
.ach{display:grid;gap:8px;margin:8px 0 18px}
.ach div{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--ink-2);border-radius:14px;padding:10px 12px}
.ach i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:rgba(234,245,240,.08);color:var(--mist-dim)}
.ach .on i{background:var(--lumen);color:#2a1a05;box-shadow:0 0 14px rgba(255,211,110,.5)}
.ach b{display:block;font:700 15px/1.2 var(--f-display)}
.ach span{font-size:13px;color:var(--mist-dim)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--f-display)}
.hud-tl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.energy{display:flex;gap:6px}
.energy svg{width:28px;height:28px;filter:drop-shadow(0 0 6px rgba(121,242,208,.6));transition:opacity .2s,transform .2s}
.energy svg.off{opacity:.22;filter:none;transform:scale(.85)}
.frag{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;color:var(--lumen);text-shadow:0 0 10px rgba(255,190,80,.5);font-variant-numeric:tabular-nums}
.frag small{font-size:14px;color:var(--mist-dim);text-shadow:none}
.hud-tc{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(340px,38vw)}
.prog{height:6px;border-radius:9px;background:rgba(234,245,240,.14);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--spore),var(--lumen))}
.prog b{position:absolute;top:-4px;width:4px;height:14px;margin-left:-2px;border-radius:3px;background:rgba(234,245,240,.35)}
.prog b.on{background:var(--lumen);box-shadow:0 0 8px var(--lumen)}
.prog em{position:absolute;top:-7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--mist);box-shadow:0 0 10px var(--lumen)}
.world-name{text-align:center;font:600 12px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--mist-dim);margin-top:10px}
.bossbar{display:flex;flex-direction:column;gap:7px;align-items:center}
.bossbar span{font:800 15px/1 var(--f-display);color:var(--rose);letter-spacing:.04em;text-shadow:0 0 12px rgba(255,80,140,.5)}
.bossbar div{display:flex;gap:6px;width:100%}
.bossbar i{flex:1;height:10px;border-radius:6px;background:var(--rose);box-shadow:0 0 10px rgba(255,80,140,.6);transition:opacity .3s}
.bossbar i.off{opacity:.15;box-shadow:none}
.hud-tr{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.timer{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;color:var(--mist)}
.icon-btn{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(121,242,208,.35);background:rgba(10,28,34,.7);color:var(--mist);font:800 16px/1 var(--f-display);cursor:pointer;display:grid;place-items:center}
.icon-btn:focus-visible{outline:2px solid var(--lumen)}
#bubble{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);max-width:min(520px,calc(100vw - 40px));display:flex;gap:12px;align-items:flex-start;background:rgba(10,28,34,.9);border:1px solid rgba(121,242,208,.35);border-radius:18px 18px 18px 6px;padding:12px 16px;opacity:0;transition:opacity .25s,transform .25s;font:400 16px/1.4 var(--f-body);color:var(--mist);box-sizing:border-box}
#bubble.show{opacity:1;transform:translate(-50%,0)}
#bubble b{font-family:var(--f-display);color:var(--spore);font-weight:800;flex:none}
@media (pointer:fine){#bubble{bottom:calc(36px + env(safe-area-inset-bottom,0px))}}
#banner{position:fixed;left:0;right:0;top:32%;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
#banner.show{opacity:1}
#banner small{display:block;font:700 13px/1 var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:var(--spore);margin-bottom:12px}
#banner b{font:900 clamp(34px,6vw,64px)/1 var(--f-display);color:var(--mist);text-shadow:0 0 30px rgba(0,0,0,.6),0 0 24px rgba(255,211,110,.35)}
#toast{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(74px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center;background:rgba(10,28,34,.95);border:1px solid var(--lumen);border-radius:16px;padding:12px 16px;transform:translateX(130%);transition:transform .4s;pointer-events:none;max-width:300px}
#toast.show{transform:none}
#toast i{width:34px;height:34px;border-radius:50%;background:var(--lumen);flex:none;box-shadow:0 0 16px rgba(255,211,110,.6)}
#toast small{display:block;font:700 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--spore);margin-bottom:5px}
#toast b{font:800 16px/1.2 var(--f-display)}

/* Diálogo */
#dlg{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(720px,calc(100vw - 32px));background:rgba(8,22,27,.94);border:1.5px solid rgba(121,242,208,.3);border-radius:22px;padding:18px 20px 16px;box-sizing:border-box;display:grid;grid-template-columns:62px 1fr;gap:16px;pointer-events:auto;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#dlgFace{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:900 26px/1 var(--f-display);color:#08161b}
#dlgName{font:800 17px/1 var(--f-display);margin-bottom:8px}
#dlgText{font:400 17px/1.5 var(--f-body);color:var(--mist);min-height:52px}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--mist-dim)}
.dlg-foot button{background:none;border:1px solid rgba(234,245,240,.25);color:var(--mist-dim);border-radius:99px;padding:6px 12px;font:700 12px/1 var(--f-body);cursor:pointer}
.dlg-foot button:focus-visible{outline:2px solid var(--lumen)}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#fade{position:fixed;inset:0;pointer-events:none;background:var(--night);opacity:1;transition:opacity .5s}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--night);z-index:5;transition:opacity .9s}
#boot div{text-align:center}
#boot p{font:700 12px/1 var(--f-body);letter-spacing:.34em;text-transform:uppercase;color:var(--spore);margin:0 0 12px}
#boot h3{font:800 26px/1 var(--f-display);margin:0;color:var(--mist)}
#boot .bar{width:180px;height:3px;background:rgba(234,245,240,.12);border-radius:3px;margin:22px auto 0;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:var(--lumen);transition:width .3s}

/* ---------- Touch ---------- */
#touch{position:fixed;inset:auto 0 0 0;height:180px;pointer-events:none;display:none}
body.touch.playing #touch{display:block}
.dpad{position:absolute;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:190px;height:96px;border-radius:48px;background:rgba(10,28,34,.45);border:1.5px solid rgba(121,242,208,.3);pointer-events:auto;display:flex;justify-content:space-between;align-items:center;padding:0 16px;box-sizing:border-box;touch-action:none}
.dpad span{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:800 24px/1 var(--f-display);color:var(--mist);background:rgba(234,245,240,.08);transition:background .08s}
.dpad span.on{background:rgba(121,242,208,.4)}
.acts{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:200px;height:150px;pointer-events:none}
.tb{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:grid;place-items:center;font:800 13px/1 var(--f-display);color:var(--mist);background:rgba(10,28,34,.5);border:1.5px solid rgba(121,242,208,.35);letter-spacing:.02em}
.tb.on{background:rgba(121,242,208,.45)}
.tb.jump{width:92px;height:92px;right:0;bottom:0;background:rgba(255,211,110,.28);border-color:var(--lumen);font-size:15px}
.tb.dash{width:66px;height:66px;right:104px;bottom:6px}
.tb.talk{width:54px;height:54px;right:22px;bottom:104px}
body.big-touch .dpad{transform:scale(1.15);transform-origin:left bottom}
body.big-touch .acts{transform:scale(1.15);transform-origin:right bottom}

body.contrast .btn{border-color:var(--mist)}
body.contrast #bubble,body.contrast #dlg{background:#000;border-color:var(--lumen)}
@media (max-width:760px){.nodes{grid-template-columns:1fr}}
@media (max-width:640px){
  .title-wrap{padding:22px 24px 22px 8px;background:linear-gradient(180deg,rgba(6,16,20,0),rgba(6,16,20,.85) 30%)}
  .btn{min-width:200px;padding:12px 18px}
  .hud-tc{top:calc(70px + env(safe-area-inset-top,0px));width:min(260px,60vw)}
  .timer{font-size:15px}
  #dlg{grid-template-columns:44px 1fr;gap:12px;padding:14px 16px}
  #dlgFace{width:44px;height:44px;font-size:20px}
  #dlgText{font-size:15.5px}
}
/* Celular em paisagem (telas baixas): menu compacto em duas colunas */
@media (max-height:560px){
  .screen{padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .title-wrap{gap:8px;max-width:none;padding:12px 48px 12px 8px}
  .studio{font-size:10px}
  .logo{font-size:clamp(40px,15vh,76px)}
  .subtitle{font-size:15px}
  .title-wrap .menu{display:grid;grid-template-columns:repeat(2,minmax(180px,auto));gap:8px;margin-top:2px}
  .btn{font-size:15px;padding:10px 18px;min-width:180px}
  .foot{font-size:11px}
  .panel{padding:16px 20px;border-radius:18px}
  .panel h2{font-size:24px}
  .panel p{margin-bottom:10px}
  .nodes{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .node{padding:12px;gap:6px}
  .node .num{font-size:26px}
  .map-head{margin-bottom:10px}
}
@media (max-height:340px){.title-wrap .menu{grid-template-columns:repeat(3,minmax(150px,auto))}.subtitle,.studio{display:none}}
@media (prefers-reduced-motion:reduce){.logo span{animation:none}}
</style>

<canvas id="game" tabindex="0" aria-label="Tela do jogo LUMEN"></canvas>

<div id="hud" hidden>
  <div class="hud-tl">
    <div class="energy" id="energy" aria-label="Energia"></div>
    <div class="frag"><svg width="18" height="22" viewBox="0 0 18 22" aria-hidden="true"><path d="M9 0 L17 9 L9 22 L1 9 Z" fill="#ffd36e"/><path d="M9 0 L9 22 L1 9 Z" fill="#e9a93a"/></svg><span id="fragCount">0</span><small id="fragTotal">/ 0</small></div>
  </div>
  <div class="hud-tc">
    <div id="progWrap"><div class="prog" id="prog"><i id="progFill"></i><em id="progDot"></em></div><div class="world-name" id="levelName"></div></div>
    <div class="bossbar" id="bossbar" hidden><span>Raizeiro, Guardião da Floresta</span><div id="bossHp"></div></div>
  </div>
  <div class="hud-tr">
    <span class="timer" id="timer">0:00.0</span>
    <button class="icon-btn" id="pauseBtn" aria-label="Pausar">II</button>
  </div>
  <div id="bubble" role="status" aria-live="polite"><b>PIP</b><span id="bubbleText"></span></div>
</div>
<div id="banner" aria-hidden="true"><small id="bannerSmall"></small><b id="bannerBig"></b></div>
<div id="toast" role="status" aria-live="polite"><i></i><div><small>Conquista</small><b id="toastText"></b></div></div>

<div id="dlg" hidden role="dialog" aria-live="polite">
  <div id="dlgFace">P</div>
  <div>
    <div id="dlgName">PIP</div>
    <div id="dlgText"></div>

const AudioSys = {

    const nd = this.noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.applyVolumes();
  },

  },

  schedule() {

    case 'orbsTell': if (B.t <= 0) { throwOrbs(ph); B.state = 'orbs'; B.t = 0.9; } break;

}
function throwOrbs(ph) {

    const o = L.orbs[i]; const T = 0.85 + i * 0.22, tx = clamp(P.x + (i - (n - 1) / 2) * 1.8, 1, 43);

    if (r.up && r.h > 0.5 && hit(pbox(), { x: r.x - 0.55, y: 0, w: 1.1, h: 2.2 * r.h })) { hurt(r.x); P.vy = 13; }

  G.g.position.y = L.goal.y + Math.sin(t * 1.2) * 0.15;
  L.cpMeshes.forEach((m, i) => { m.bulb.position.y = 1.35 + Math.sin(t * 2 + i) * 0.04; });
  L.shafts.forEach(s => { s.m.material.opacity = s.base * (0.6 + 0.4 * Math.sin(t * 0.4 + s.ph)); });
}

/* ===================================================================
   LAÇO PRINCIPAL
   =================================================================== */
function resize() {
  const w = innerWidth, h = innerHeight, q = S.quality;
  const pr = q === 'alta' ? Math.min(devicePixelRatio, 2) : q === 'media' ? Math.min(devicePixelRatio, 1.3) : Math.min(devicePixelRatio, 1);
  renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  camDist = camera.aspect < 1.25 ? 16 * Math.min(1.75, 1.25 / camera.aspect) : 16;
  const sc = h * pr / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  parts.material.uniforms.uScale.value = sc; flies.material.uniforms.uScale.value = sc;
  setupPost();
}
addEventListener('resize', resize);
const STEP = 1 / 120;
let acc = 0, last = performance.now(), hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  clock += dt; U.time.value = clock;
  pollPad();
  if (state === 'dialog') updateDialog(dt);
  if (press.talk) {
    press.talk = false;
    if (state === 'play') {
      const nxt = L.hints.filter(h => h.x <= P.x + 4).pop();
      const help = run.deathsAtCp >= 1 ? L.help[run.cp] : null;
      say(fmtHint(help || (nxt ? nxt.t : (L.boss ? L.help[0] : 'Siga os fragmentos dourados. Eles sempre mostram um caminho!'))), 5);
    }
  }
  if (state === 'play') {
    acc += dt; let n = 0;
    while (acc >= STEP && n++ < 10) { physicsStep(STEP); acc -= STEP; if (state !== 'play') break; }
    if (n >= 10) acc = 0;
    if (run && state !== 'dialog') run.time += dt;
    if (comboT > 0) comboT -= dt;
    const chased = L.enemies.some(e => e.alive && e.state === 'chase') || L.flyers.some(f => f.alive && (f.state === 'tell' || f.state === 'dive'));
    AudioSys.intensity = damp(AudioSys.intensity, chased ? 0.9 : (P.x > L.end - 45 ? 0.7 : 0.5), 1.5, dt);
    hudT -= dt;
    if (hudT <= 0 && run) {
      hudT = 0.05; $('#timer').textContent = S.explore ? 'Exploração' : fmtTime(run.time);
      const pr = clamp(P.x / L.goal.x, 0, 1) * 100; $('#progFill').style.width = pr + '%'; $('#progDot').style.left = pr + '%';
    }
  } else if (state === 'victory') {
    victoryT += dt; P.vx = 0;
    if (Math.random() < 0.3) emit(L.goal.x + rand(-3, 3), L.goal.y + rand(-1, 3), rand(-1, 1), 1, { color: Math.random() < .5 ? 0xffd36e : 0x79f2d0, speed: 0.8, grav: -1.2, life: 1.5 });
  } else if (state === 'title') { simTime += dt; if (L) stepMovers(simTime); }
  if (bubbleT > 0) { bubbleT -= dt; if (bubbleT <= 0) $('#bubble').classList.remove('show'); }
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('#banner').classList.remove('show'); }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('#toast').classList.remove('show'); }
  document.body.classList.toggle('playing', state === 'play');
  if (L) {
    updateCamera(dt);
    const frozen = state === 'pause' || state === 'defeat';
    if (state === 'title' || state === 'boot') { P.x = 2.5; P.y = 0; P.vx = 0; P.vy = 0; P.onGround = true; }
    animate(frozen ? 0 : dt, clock);
    updateParticles(frozen ? 0 : dt);
    if (flies.visible) updateFlies(clock);
    renderFrame();
  }
}


/* ===================================================================
   ANDROID — botão voltar, ciclo de vida do app
   =================================================================== */
let exitArmedUntil = 0;
function exitHint() {
  let el = $('#exitHint');
  if (!el) { el = document.createElement('div'); el.id = 'exitHint'; el.textContent = 'Toque em voltar de novo para sair'; document.body.appendChild(el); }
  el.classList.add('show'); clearTimeout(exitHint.t); exitHint.t = setTimeout(() => el.classList.remove('show'), 1900);
}
// Retorna true se o jogo tratou o "voltar"; false = o app pode fechar.
window.__lumenBack = () => {
  try {
    if (state === 'boot') return true;
    if (state === 'play') { pauseGame(); return true; }
    if (state === 'dialog') { const s = $('#dlgSkip'); if (s && !s.hidden) s.click(); return true; }
    const back = screens.querySelector('[data-act="back"], #map-back');
    if (back) { back.click(); return true; }
    if (state === 'pause') { resumeGame(); return true; }
    if (state === 'title') {
      const now = performance.now();
      if (now < exitArmedUntil) { persistRun(); return false; }
      exitArmedUntil = now + 2000; exitHint(); return true;
    }
    const toMap = screens.querySelector('[data-act="toMap"]');
    if (toMap) { toMap.click(); return true; }
    return true;
  } catch (e) { return false; }
};
window.__lumenPause = () => {
  try {
    if (state === 'play') pauseGame();
    else if (run && state === 'pause') persistRun();
    for (const k in keys) keys[k] = false;
    touch.left = touch.right = touch.jump = false;
    if (AudioSys.ctx && AudioSys.ctx.state === 'running') AudioSys.ctx.suspend();
  } catch (e) {}
};
window.__lumenResume = () => {
  try { if (AudioSys.ctx && state !== 'pause' && state !== 'play') AudioSys.ctx.resume(); } catch (e) {}
};
addEventListener('contextmenu', e => e.preventDefault());

/* ===================================================================
   INICIALIZAÇÃO
   =================================================================== */
const bar = $('#bootBar'); bar.style.width = '40%';
setTimeout(() => {
  buildLevel('1-1');
  applySettings();
  bar.style.width = '100%';
  requestAnimationFrame(t => { last = t; frame(t);
    setTimeout(() => { $('#boot').style.opacity = 0; $('#fade').style.opacity = 0; setTimeout(() => $('#boot').remove(), 900); state = 'title'; titleScreen(); }, 700);
  });
}, 50);
})();
</script>
